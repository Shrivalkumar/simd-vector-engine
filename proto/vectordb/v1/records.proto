syntax = "proto3";

package vectordb.v1;

message DenseVector {
  uint32 dimension = 1;
  bytes fp32_le = 2;
}

message PayloadValue {
  oneof value {
    string string_value = 1;
    sint64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
  }
}

message PayloadField {
  string key = 1;
  PayloadValue value = 2;
}

message Record {
  uint64 id = 1;
  uint64 generation = 2;
  DenseVector vector = 3;
  repeated PayloadField payload = 4;
}

message EqualityCondition {
  string field = 1;
  PayloadValue value = 2;
}

message RangeCondition {
  string field = 1;
  optional double greater_than = 2;
  optional double greater_than_or_equal = 3;
  optional double less_than = 4;
  optional double less_than_or_equal = 5;
}

message ExistsCondition {
  string field = 1;
}

message FieldCondition {
  oneof condition {
    EqualityCondition equality = 1;
    RangeCondition range = 2;
    ExistsCondition exists = 3;
  }
}

message Filter {
  repeated FieldCondition must = 1;
  repeated Filter should = 2;
  repeated Filter must_not = 3;
}

